name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.5' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: label-printer-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish APK as a public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk --title "Label printer APK" --notes "Debug build for the K388 Pro. Download app-debug.apk below."
